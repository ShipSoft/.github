name: Pixi lock update (reusable)

on:
  workflow_call:
    inputs:
      base:
        description: Branch to open the pixi-update PR against (e.g. main, master)
        type: string
        required: true
      add-paths:
        description: Paths to include in the PR (newline-separated)
        type: string
        default: pixi.lock
      pr-branch:
        description: Branch name used for the PR
        type: string
        default: update-pixi
      pr-label:
        description: Label to apply to the PR
        type: string
        default: pixi
    secrets:
      app-private-key:
        description: >-
          Private key of the ship's mate GitHub App (pass
          secrets.APP_PRIVATE_KEY). The PR is then opened by ship's mate, so
          the caller's CI runs on it. Without it the PR is opened with
          GITHUB_TOKEN, and GitHub does not start workflows for those.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pixi-update:
    runs-on: ubuntu-latest
    # Secrets can't be tested in `if:`, so expose whether the key was passed.
    env:
      HAS_APP_KEY: ${{ secrets.app-private-key != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          run-install: false
      - name: Update lock files
        run: |
          set -o pipefail
          # Capture the diff JSON separately so a pixi-diff-to-markdown crash
          # (e.g. https://github.com/pavelzw/pixi-diff-to-markdown assertion on
          # versions differing only by a normalized segment) degrades the PR
          # body instead of aborting the update and losing the PR entirely.
          pixi update --json > update.json
          pixi exec pixi-diff-to-markdown < update.json >> diff.md \
            || echo "_Automated dependency diff unavailable: pixi-diff-to-markdown crashed (see the lockfile diff in this PR)._" >> diff.md
      # PRs opened with GITHUB_TOKEN don't trigger workflows, so CI would
      # never start on them. A ship's mate token avoids that. The client ID
      # is an org variable, readable here without the caller passing it.
      - name: Create app token
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: Resolve app identity
        id: identity
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "user=${APP_SLUG}[bot] <${id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          author: ${{ steps.identity.outputs.user || format('{0} <{1}+{0}@users.noreply.github.com>', github.actor, github.actor_id) }}
          committer: ${{ steps.identity.outputs.user || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
          commit-message: "chore: update pixi lock file"
          title: Update pixi lock file
          body-path: diff.md
          branch: ${{ inputs.pr-branch }}
          base: ${{ inputs.base }}
          labels: ${{ inputs.pr-label }}
          delete-branch: true
          add-paths: ${{ inputs.add-paths }}

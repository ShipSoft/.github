name: Rattler build and upload (reusable)

on:
  workflow_call:
    inputs:
      recipe-dir:
        description: Directory containing recipe.yaml files (with subdirectories).
        type: string
        default: 'recipes/'
      recipe:
        description: |
          Single recipe directory name to build (e.g. "random123"). When set,
          overrides recipe-dir and rattler-build pulls dependencies from the
          configured channels. Leave empty to build all recipes under recipe-dir.
        type: string
        default: ''
      platforms:
        description: |
          JSON list of conda subdirs to build natively, one job each. Supported:
          linux-64, linux-aarch64, osx-arm64. noarch packages are uploaded
          and kept as artifacts from the first platform's job only.
        type: string
        default: '["linux-64"]'
      force:
        description: Drop --skip-existing (use to rebuild on the same version).
        type: boolean
        default: false
      upload:
        description: Upload built packages to prefix.dev/<channel-name>.
        type: boolean
        default: false
      channel-name:
        description: prefix.dev channel name to upload to (when upload=true).
        type: string
        default: ship
      extra-channels:
        description: Newline-separated channels to pass via --channel during build.
        type: string
        default: |
          https://prefix.dev/ship
          conda-forge
      variant-config:
        description: |
          Newline-separated variant config files (relative to the repository
          root) to pass via --variant-config, e.g. global compiler pins. They
          take priority over each recipe's own variants.yaml.
        type: string
        default: ''
      artifact-retention-days:
        description: Days to keep the built-package artifact on PR runs.
        type: number
        default: 7
    secrets:
      prefix-dev-api-key:
        description: |
          prefix.dev API key. Leave unset to upload with trusted publishing
          instead: the caller then grants `id-token: write` and the channel
          lists the calling workflow as a trusted publisher.
        required: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: >-
      ${{ matrix.platform == 'linux-aarch64' && 'ubuntu-24.04-arm'
       || matrix.platform == 'osx-arm64' && 'macos-15'
       || 'ubuntu-latest' }}
    env:
      PLATFORM: ${{ matrix.platform }}
      # Every job builds the noarch packages its recipes need, but only one
      # job publishes them.
      KEEP_NOARCH: ${{ matrix.platform == fromJSON(inputs.platforms)[0] }}
    steps:
      - uses: actions/checkout@v7

      - name: Check platform
        run: |
          case "$PLATFORM" in
            linux-64|linux-aarch64|osx-arm64) ;;
            *) echo "::error::Unsupported platform '$PLATFORM'"; exit 1 ;;
          esac

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: true  # fails the job if pixi.lock is dirty

      - name: Cache rattler-build package downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/rattler
          key: rattler-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            rattler-${{ matrix.platform }}-

      - name: Build with rattler-build
        env:
          INPUT_RECIPE_DIR: ${{ inputs.recipe-dir }}
          INPUT_RECIPE: ${{ inputs.recipe }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_CHANNELS: ${{ inputs.extra-channels }}
          INPUT_VARIANT_CONFIG: ${{ inputs.variant-config }}
        run: |
          set -euo pipefail

          channel_args=()
          while IFS= read -r ch; do
            ch="${ch//[$'\t\r ']}"
            [ -z "$ch" ] && continue
            channel_args+=(--channel "$ch")
          done <<< "$INPUT_CHANNELS"

          variant_args=()
          while IFS= read -r vc; do
            vc="${vc#"${vc%%[![:space:]]*}"}"
            vc="${vc%"${vc##*[![:space:]]}"}"
            [ -z "$vc" ] && continue
            variant_args+=(--variant-config "$vc")
          done <<< "$INPUT_VARIANT_CONFIG"

          skip_args=(--skip-existing=all)
          if [ "$INPUT_FORCE" = "true" ]; then
            skip_args=()
          fi

          if [ -n "$INPUT_RECIPE" ]; then
            target=(--recipe "${INPUT_RECIPE_DIR%/}/$INPUT_RECIPE")
          else
            target=(--recipe-dir "$INPUT_RECIPE_DIR")
          fi

          pixi run rattler-build build "${target[@]}" "${channel_args[@]}" "${variant_args[@]}" "${skip_args[@]}"

      - name: Collect packages to publish
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p publish
          files=("output/$PLATFORM"/*.conda)
          if [ "$KEEP_NOARCH" = "true" ]; then
            files+=(output/noarch/*.conda)
          fi
          for f in "${files[@]}"; do
            subdir=$(basename "$(dirname "$f")")
            mkdir -p "publish/$subdir"
            cp "$f" "publish/$subdir/"
          done

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build summary ($PLATFORM)"
            echo
            shopt -s nullglob
            files=(publish/*/*.conda)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "_No \`.conda\` artifacts produced._"
            else
              echo "Built ${#files[@]} package(s)."
              echo
              echo "| File | Size |"
              echo "|------|------|"
              for f in "${files[@]}"; do
                size=$(wc -c < "$f" | tr -d ' ')
                if [ "$size" -ge 1048576 ]; then
                  hsize="$(awk -v s="$size" 'BEGIN{printf "%.1f MiB", s/1048576}')"
                else
                  hsize="$(awk -v s="$size" 'BEGIN{printf "%.0f KiB", s/1024}')"
                fi
                echo "| \`$(basename "$f")\` | $hsize |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR build artifact
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: conda-packages-${{ matrix.platform }}
          path: publish/
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload to prefix.dev
        if: ${{ inputs.upload }}
        env:
          PREFIX_DEV_API_KEY: ${{ secrets.prefix-dev-api-key }}
          CHANNEL: ${{ inputs.channel-name }}
          # Without an API key, rattler-build exchanges the job's OIDC token.
          # A failed exchange is only logged at debug level; the upload then
          # goes out anonymously and fails with a bare 403.
          RUST_LOG: rattler_networking=debug
        run: |
          set -euo pipefail
          shopt -s nullglob
          auth_args=()
          if [ -n "$PREFIX_DEV_API_KEY" ]; then
            auth_args=(--api-key "$PREFIX_DEV_API_KEY")
          fi
          uploaded=0
          for pkg in publish/*/*.conda; do
            pixi run rattler-build upload prefix \
              "${auth_args[@]}" \
              -c "$CHANNEL" \
              --skip-existing "$pkg"
            uploaded=$((uploaded + 1))
          done
          echo "Uploaded $uploaded package(s) to prefix.dev/$CHANNEL."

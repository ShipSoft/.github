<!-- SHiP Doxygen theme footer. Version-independent: only standard Doxygen
     placeholders are used, so it works with Doxygen 1.9.x and 1.1x alike. -->
<!--BEGIN GENERATE_TREEVIEW-->
<div id="nav-path" class="navpath"><!-- id is needed for treeview function! -->
  <ul>
    $navpath
    <li class="footer">$generatedby <a href="https://www.doxygen.org/index.html">Doxygen</a> $doxygenversion</li>
  </ul>
</div>
<!--END GENERATE_TREEVIEW-->
<!--BEGIN !GENERATE_TREEVIEW-->
<hr class="footer"/><address class="footer"><small>
$generatedby&#160;<a href="https://www.doxygen.org/index.html">Doxygen</a> $doxygenversion
</small></address>
</div><!-- doc-content -->
<!--END !GENERATE_TREEVIEW-->

<!-- SHiP theme: scripts (doxygen-awesome extensions) -->
<script type="text/javascript" src="$relpath^doxygen-awesome-darkmode-toggle.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-fragment-copy-button.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-paragraph-link.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-interactive-toc.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-tabs.js"></script>
<script type="text/javascript">
  DoxygenAwesomeDarkModeToggle.init();
  DoxygenAwesomeFragmentCopyButton.init();
  DoxygenAwesomeParagraphLink.init();
  DoxygenAwesomeInteractiveToc.init();
  DoxygenAwesomeTabs.init();

  /* favicon + collaboration footer line (no HTML_HEADER needed) */
  (function () {
    var rel = "$relpath^";
    var link = document.createElement("link");
    link.rel = "icon"; link.type = "image/png"; link.sizes = "192x192";
    link.href = rel + "favicon-192.png";
    document.head.appendChild(link);

    var footer = document.createElement("div");
    footer.className = "ship-footer";
    footer.innerHTML =
      '<span>&copy; CERN for the benefit of the SHiP Collaboration</span>' +
      '<a href="https://shipsoft.github.io/Documentation/">SHiP Software documentation</a>' +
      '<a href="https://github.com/ShipSoft">github.com/ShipSoft</a>' +
      '<a href="https://ship.web.cern.ch/">ship.web.cern.ch</a>';
    var content = document.getElementById("doc-content") || document.body;
    content.appendChild(footer);
  })();
</script>
</body>
</html>
